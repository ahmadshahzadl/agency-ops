name: Deploy to production

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/fuorix/app/backend
            git pull origin main
            .venv/bin/pip install -q -r requirements.txt
            .venv/bin/alembic upgrade head
            systemctl restart fuorix

            cd /opt/fuorix/app/frontend
            npm ci
            VITE_API_URL=https://app.fuorix.com npm run build

      - name: Health check
        run: |
          sleep 5
          status=$(curl -s -o /dev/null -w "%{http_code}" https://app.fuorix.com/health)
          echo "HTTP $status"
          if [ "$status" != "200" ]; then
            echo "Health check failed"
            exit 1
          fi

# Note: content-mutation scripts (apply_blog_plan.py, apply_case_study_*.py,
# set_case_study_image.py, rebrand_*.py) are intentionally NOT run here.
# Those publish/change business content and are meant to be reviewed with
# --dry-run and run by hand, not fired automatically on every code push.
